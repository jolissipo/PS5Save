# Seconds between backup checks (30 to 3600).
backup_interval_seconds=30

# Visual notification mode (all, errors or off).
backup_notifications=all

# Show notifications during game or app activity (true or false).
backup_notifications_in_game=true

# Enable decrypted PS4 and PS5 save backups (true or false).
backup_ps4_saves=true
backup_ps5_saves=true

# Include original encrypted PS4 and PS5 saves and PS4 companion keys.
backup_encrypted_saves=true

# Include PS4 and PS5 trophy progress and catalogs.
backup_ps4_trophies=true
backup_ps5_trophies=true

# Maximum combined decrypted save-image size per title in MB.
max_title_size_mb=4096

# Daily snapshots to retain (0 to 10, with 0 disabling snapshots).
daily_snapshots_to_keep=3

# Emulator backup paths. Comment out paths you do not use.

# PS5SX2
/data/PCSX2/Mcd001.ps2
/data/PCSX2/Mcd002.ps2

# PS5SX3
/data/homebrew/PPSA99303/rpcs3/dev_hdd0/home/

# Porpoise
/data/porpoise/saves/

# ProsperoEden
/data/prosperoeden/user/nand

# PS5X360
/data/homebrew/PPSA50011/saves
