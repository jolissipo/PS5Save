# PS5Save+ default configuration
# Copy this file to the root of an exFAT USB drive as backup.conf.
# The dashboard is available at http://<PS5-IP>:8755 while the ELF runs.
#
# Seconds between checks (30 to 3600). First check runs immediately.
backup_interval_seconds=30

# Notification policy: all (useful results and problems), errors, off.
backup_notifications=all

# Keep gameplay free of pop-ups by default.
backup_notifications_in_game=false

# Decrypted saves (close the title for consistent backups).
backup_ps4_saves=true
backup_ps5_saves=true

# Preserve original encrypted saves and PS4 companion keys.
backup_encrypted_saves=true

# Trophy progress and shared catalogs.
backup_ps4_trophies=true
backup_ps5_trophies=true

# Maximum combined save image size per title, in decimal MB.
max_title_size_mb=4096

# Dated USB snapshots to retain (0 disables, maximum 10).
daily_snapshots_to_keep=3

# Optional emulator locations: uncomment only those you use.
# PS5SX2
#/data/PCSX2/Mcd001.ps2
#/data/PCSX2/Mcd002.ps2

# PS5SX3
#/data/homebrew/PPSA99303/rpcs3/dev_hdd0/home/

# Porpoise
#/data/porpoise/saves/

# ProsperoEden
#/data/prosperoeden/user/nand

# PS5X360
#/data/homebrew/PPSA50011/saves
