name: PS5Save+ validation
on:
  push:
    branches:
      - development/ps5save-plus
  pull_request:
    branches:
      - main
    paths:
      - '**.c'
      - '**.h'
      - '**.sh'
      - 'dashboard/**'
      - 'Makefile'
      - '.github/workflows/host-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Build and run host tests
        run: sh tests/run-host-tests.sh
      - name: Check dashboard JavaScript syntax and launcher metadata
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          import pathlib, json
          class ScriptParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.in_script = False
                  self.scripts = []
              def handle_starttag(self, name, attrs):
                  if name == "script": self.in_script = True
              def handle_endtag(self, name):
                  if name == "script": self.in_script = False
              def handle_data(self, data):
                  if self.in_script: self.scripts.append(data)
          p = ScriptParser()
          p.feed(pathlib.Path("dashboard/index.html").read_text(encoding="utf-8"))
          assert len(p.scripts) == 1, "Dashboard must contain one inline script"
          pathlib.Path("/tmp/ps5save-dashboard.js").write_text(p.scripts[0], encoding="utf-8")
          j = json.loads(pathlib.Path("launcher/param.json").read_text(encoding="utf-8"))
          assert j["titleId"] == "P5SV00001"
          assert j["deeplinkUri"] == "http://127.0.0.1:8755/"
          PY
          node --check /tmp/ps5save-dashboard.js

  ps5-sdk-build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install PS5 SDK toolchain prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends clang lld unzip
      - name: Download official PS5 Payload SDK v0.50
        run: |
          curl --fail --location --retry 3 --silent --show-error \
            --output "$RUNNER_TEMP/sdk.zip" \
            "https://github.com/ps5-payload-dev/sdk/releases/download/v0.50/ps5-payload-sdk.zip"
          unzip -q "$RUNNER_TEMP/sdk.zip" -d "$RUNNER_TEMP/sdk"
          test -f "$RUNNER_TEMP/sdk/ps5-payload-sdk/toolchain/prospero.mk"
      - name: Cross-compile PS5Save+ ELF
        run: |
          make PS5_PAYLOAD_SDK="$RUNNER_TEMP/sdk/ps5-payload-sdk"
          make PS5_PAYLOAD_SDK="$RUNNER_TEMP/sdk/ps5-payload-sdk" launcher-installer.elf
          test -s backup.elf
          test -s launcher-installer.elf
          file backup.elf launcher-installer.elf
          readelf -h backup.elf | head -n 28
          readelf -h launcher-installer.elf | head -n 28
      - name: Upload development ELF for inspection (not a release)
        uses: actions/upload-artifact@v4
        with:
          name: ps5save-plus-development-elf
          path: |
            backup.elf
            launcher-installer.elf
          if-no-files-found: error
          retention-days: 5
