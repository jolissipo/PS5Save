name: PS5Save+ host tests
on:
  push:
    branches:
      - development/ps5save-plus
  pull_request:
    paths:
      - '**.c'
      - '**.h'
      - '**.sh'
      - 'dashboard/**'
      - 'Makefile'
      - '.github/workflows/host-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Build and run host tests
        run: sh tests/run-host-tests.sh
